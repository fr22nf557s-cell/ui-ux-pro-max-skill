# Cloudflare Pages configuration.
#
# Secrets are NEVER listed here — set them in the Pages dashboard under
# Settings → Environment variables, marked "Encrypt":
#   TURNSTILE_SECRET_KEY
#   RESEND_API_KEY
#
# The plain vars below are safe to commit; they are not credentials.

name = "hornet-drones"
compatibility_date = "2026-09-15"
pages_build_output_dir = "dist"

[vars]
SITE_URL = "https://hornetdrones.com"   # no trailing slash — API builds links from this
MAIL_FROM = "Hornet Drones <alpha@hornetdrones.com>"

# Created with:
#   npx wrangler d1 create hornet-waitlist
# then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "hornet-waitlist"
database_id = "PASTE_DATABASE_ID_HERE"
