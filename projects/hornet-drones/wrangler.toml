# Cloudflare Pages configuration.
#
# Secrets are NEVER listed here — set them in the Pages dashboard under
# Settings → Environment variables, marked "Encrypt":
#   TURNSTILE_SECRET_KEY
#   RESEND_API_KEY
#
# The plain vars below are safe to commit; they are not credentials.

name = "hornet-drones"
compatibility_date = "2026-09-15"
pages_build_output_dir = "dist"

[vars]
SITE_URL = "https://hornetdrones.com"   # no trailing slash — API builds links from this
MAIL_FROM = "Hornet Drones <alpha@hornetdrones.com>"

# No [[d1_databases]] block on purpose.
#
# The database is bound in the Pages dashboard (Settings → Functions → D1
# database bindings, variable name DB), which is what production actually
# reads. Leaving a placeholder database_id here would fail the Pages build
# before it ever got to the site.
#
# If you later want `wrangler dev` locally, add the block back with the real id
# from the dashboard — it is an identifier, not a secret.
