<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0C10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The hero poster is the LCP element; ask for it before the bundle parses. -->
    <link rel="preload" as="image" href="/hornet-flight-poster.jpg" fetchpriority="high" />
    <title>Hornet Drones — Autonomous Aerial Protection</title>
    <meta
      name="description"
      content="The ultra-quiet, AI-powered perimeter drone system that patrols, detects, and deters threats before they reach your doorstep."
    />

    <!-- Update the domain here and in wrangler.toml, robots.txt and sitemap.xml together. -->
    <link rel="canonical" href="https://hornetdrones.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hornetdrones.com/" />
    <meta property="og:title" content="Hornet Drones — Autonomous Aerial Protection" />
    <meta
      property="og:description"
      content="The ultra-quiet, AI-powered perimeter drone system that patrols, detects, and deters threats before they reach your doorstep."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://hornetdrones.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hornet Drones. Autonomous aerial protection." />
    <meta name="twitter:image" content="https://hornetdrones.com/og.jpg" />
    <meta property="og:site_name" content="Hornet Drones" />
    <meta property="og:locale" content="en_GB" />

    <!--
      Organization + Product only.

      Deliberately NOT LocalBusiness: that type is for premises customers visit,
      and misusing it risks a structured-data manual action. Equally there is no
      `offers` block (no public price) and no `aggregateRating` (no reviews) —
      inventing either is exactly the kind of markup that earns a penalty.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://hornetdrones.com/#org",
            "name": "Hornet Drones",
            "url": "https://hornetdrones.com/",
            "logo": "https://hornetdrones.com/press/hornet-mark.png",
            "email": "hello@hornetdrones.com",
            "description": "Autonomous aerial perimeter protection for private property."
          },
          {
            "@type": "WebSite",
            "@id": "https://hornetdrones.com/#site",
            "url": "https://hornetdrones.com/",
            "name": "Hornet Drones",
            "publisher": { "@id": "https://hornetdrones.com/#org" }
          },
          {
            "@type": "Product",
            "name": "HRN-01",
            "description": "Ultra-quiet autonomous perimeter drone with thermal and optical sensing, returning to a weatherproof charging nest between patrols.",
            "category": "Home security system",
            "brand": { "@id": "https://hornetdrones.com/#org" }
          }
        ]
      }
    </script>

  </head>
  <body>
    <!--
      Paint-first shell. The hero's backdrop, as plain HTML, so the largest
      element on screen is painted before the bundle has even parsed. Hero.jsx
      removes it the moment the real hero has committed; on a fast connection
      nobody sees the handover, on a slow one they see the site instead of a
      black screen.
    -->
    <img
      id="lcp-shell"
      src="/hornet-flight-poster.jpg"
      alt=""
      fetchpriority="high"
      decoding="async"
      style="position:fixed;inset:0;width:100%;height:100vh;height:100svh;object-fit:cover;object-position:50% 38%;filter:brightness(.42);pointer-events:none"
    />
    <div id="root" style="position:relative"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
