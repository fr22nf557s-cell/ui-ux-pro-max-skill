<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0C10" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230B0C10'/%3E%3Cpath d='M12 2.4 20.2 7.2v9.6L12 21.6 3.8 16.8V7.2z' fill='none' stroke='%23F59E0B' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23F59E0B'/%3E%3C/svg%3E"
    />
    <title>Hornet Drones — Autonomous Aerial Protection</title>
    <meta
      name="description"
      content="The ultra-quiet, AI-powered perimeter drone system that patrols, detects, and deters threats before they reach your doorstep."
    />

    <!-- Update the domain here and in wrangler.toml, robots.txt and sitemap.xml together. -->
    <link rel="canonical" href="https://hornetdrones.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hornetdrones.com/" />
    <meta property="og:title" content="Hornet Drones — Autonomous Aerial Protection" />
    <meta
      property="og:description"
      content="The ultra-quiet, AI-powered perimeter drone system that patrols, detects, and deters threats before they reach your doorstep."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Organization + Product only.

      Deliberately NOT LocalBusiness: that type is for premises customers visit,
      and misusing it risks a structured-data manual action. Equally there is no
      `offers` block (no public price) and no `aggregateRating` (no reviews) —
      inventing either is exactly the kind of markup that earns a penalty.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://hornetdrones.com/#org",
            "name": "Hornet Drones",
            "url": "https://hornetdrones.com/",
            "description": "Autonomous aerial perimeter protection for private property."
          },
          {
            "@type": "WebSite",
            "@id": "https://hornetdrones.com/#site",
            "url": "https://hornetdrones.com/",
            "name": "Hornet Drones",
            "publisher": { "@id": "https://hornetdrones.com/#org" }
          },
          {
            "@type": "Product",
            "name": "HRN-01",
            "description": "Ultra-quiet autonomous perimeter drone with thermal and optical sensing, returning to a weatherproof charging nest between patrols.",
            "category": "Home security system",
            "brand": { "@id": "https://hornetdrones.com/#org" }
          }
        ]
      }
    </script>

    <!-- Fonts: preconnect first so the display face is not the LCP bottleneck. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
