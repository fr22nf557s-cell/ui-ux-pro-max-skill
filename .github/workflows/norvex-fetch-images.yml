name: Norvex – fetch product images

# Runs the storefront's gallery fetcher + matcher on a GitHub-hosted runner (which has
# normal internet access), converts matched packshots to WebP and commits them to the
# branch. Trigger it from the Actions tab (or the API) with the gallery URLs to walk,
# or push a commit whose message contains [fetch-images] to the branch below.

on:
  push:
    branches:
      - claude/norvex-gaming-ecommerce-5x8luq
  workflow_dispatch:
    inputs:
      galleries:
        description: "Gallery URLs to walk, one per line"
        required: true
        default: |
          https://www.pokemon.com/uk/pokemon-tcg/product-gallery
          https://www.pokemon.com/us/pokemon-tcg/product-gallery
          https://magic.wizards.com/en/products --crawl /en/products/ --max-pages 20
          https://en.onepiece-cardgame.com/products/ --crawl /products/ --max-pages 12
          https://www.yugioh-card.com/eu/products/latest-releases/ --crawl /eu/products/ --max-pages 20
          https://www.disneylorcana.com/en-GB/ --crawl /en-GB/product/ --max-pages 12
          https://starwarsunlimited.com/product-guide --crawl /products/ --max-pages 12
          https://world.digimoncard.com/products/ --crawl /products/ --max-pages 10
          https://www.dbs-cardgame.com/fw/en/products/ --crawl /fw/en/products/ --max-pages 10
          https://riftbound.leagueoflegends.com/en-us/ --crawl /en-us/ --max-pages 8
          https://fabtcg.com/products/ --channel chrome
      min_score:
        description: "Minimum match score (0–1)"
        required: false
        default: "0.6"
      commit:
        description: "Commit matched images to the branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: norvex-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fetch-images]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/norvex-gaming
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium + sharp
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund sharp

      - name: Walk galleries
        env:
          GALLERIES: ${{ inputs.galleries || 'https://www.pokemon.com/uk/pokemon-tcg/product-gallery\nhttps://www.pokemon.com/us/pokemon-tcg/product-gallery\nhttps://magic.wizards.com/en/products --crawl /en/products/ --max-pages 20\nhttps://en.onepiece-cardgame.com/products/ --crawl /products/ --max-pages 12\nhttps://www.yugioh-card.com/eu/products/latest-releases/ --crawl /eu/products/ --max-pages 20\nhttps://www.disneylorcana.com/en-GB/ --crawl /en-GB/product/ --max-pages 12\nhttps://starwarsunlimited.com/product-guide --crawl /products/ --max-pages 12\nhttps://world.digimoncard.com/products/ --crawl /products/ --max-pages 10\nhttps://www.dbs-cardgame.com/fw/en/products/ --crawl /fw/en/products/ --max-pages 10\nhttps://riftbound.leagueoflegends.com/en-us/ --crawl /en-us/ --max-pages 8\nhttps://fabtcg.com/products/ --channel chrome' }}
        run: |
          set +e
          echo "## Galleries" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            set -- $line; url="$1"; shift
            echo "::group::$url $*"
            host="$(node -e "console.log(new URL(process.argv[1]).hostname.replace(/^www\./,''))" "$url")"
            slugp="$(node -e "console.log((new URL(process.argv[1]).pathname.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'root').slice(0,60))" "$url")"
            out="assets/img/gallery/$host/$slugp"
            if node scripts/fetch-gallery.mjs "$url" --out "$out" --max-rounds 25 --debug "$@"; then
              n="$(tail -n +2 "$out/manifest.csv" 2>/dev/null | wc -l | xargs)"
              echo "- ✅ $url — $n images" >> "$GITHUB_STEP_SUMMARY"
              echo "--- manifest head ($url):"; head -60 "$out/manifest.csv" | cut -c1-220
            else
              echo "- ❌ $url — fetch failed (see log)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done <<< "$(printf '%b' "$GALLERIES")"
          exit 0

      - name: Sync with the branch (other commits may have landed during the walk)
        run: git pull --rebase --quiet origin "${{ github.ref_name }}"

      - name: Match images to products
        run: |
          node scripts/match-images.mjs --min-score "${{ inputs.min_score || '0.6' }}" --apply | tee match.log
          echo "--- build catalogue products from the galleries (current lines, official packshots):"
          node scripts/catalog-from-galleries.mjs --apply --replace | tee -a match.log
          echo "--- tidy: drop non-products, house-style names, merge duplicates, placeholder photos, featured picks:"
          node scripts/tidy-catalog.mjs --apply | tee -a match.log
          echo "## Matching" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat match.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat assets/img/gallery/match-report.csv >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Optimise matched images (WebP, max 1000px)
        run: node scripts/optimize-images.mjs

      - name: Upload manifests and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norvex-gallery-manifests
          path: |
            projects/norvex-gaming/assets/img/gallery/**/manifest.csv
            projects/norvex-gaming/assets/img/gallery/match-report.csv
          if-no-files-found: ignore

      - name: Commit matched images
        if: ${{ github.event_name == 'push' || inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/products assets/js/catalog.js
          if git diff --cached --quiet; then echo "Nothing matched — no commit."; exit 0; fi
          git commit -m "chore(norvex): add matched product images from publisher galleries"
          for attempt in 1 2 3 4; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejected (attempt $attempt): rebasing the generated commit onto the latest branch"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { git rebase --abort; echo "::error::could not rebase the generated commit onto the branch; re-run the workflow"; exit 1; }
          done
          exit 1
