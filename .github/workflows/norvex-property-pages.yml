name: Norvex Property to Cloudflare Pages

# Deploys projects/norvex-property/film to a Cloudflare Pages project on the
# owner's Cloudflare account, and optionally attaches a custom domain.
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (Account: Cloudflare Pages Edit; Zone: DNS Edit for the domain's zone)
#   CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain to attach (e.g. norvexproperty.co.uk). Leave blank to skip."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: norvex-property
      SITE_DIR: projects/norvex-property/film
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
          test -f "$SITE_DIR/index.html" || { echo "site not found"; exit 1; }
          test -f "$SITE_DIR/assets/manor.mp4" || { echo "film assets missing: run 'Norvex film assets' first"; exit 1; }

      - name: Create the Pages project (first run only)
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>/dev/null \
            || echo "project exists"

      - name: Deploy
        run: |
          npx --yes wrangler@3 pages deploy "$SITE_DIR" --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Attach the custom domain
        if: ${{ inputs.domain != '' }}
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          APEX=$(echo "$DOMAIN" | awk -F. '{n=NF; print $(n-1)"."$n}')
          case "$DOMAIN" in *.co.uk|*.org.uk|*.me.uk|*.ac.uk) APEX=$(echo "$DOMAIN" | awk -F. '{n=NF; print $(n-2)"."$(n-1)"."$n}');; esac
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$APEX" | node -pe 'JSON.parse(require("fs").readFileSync(0)).result[0]?.id ?? ""')
          test -n "$ZONE" || { echo "zone $APEX not found on this account: add the domain to Cloudflare first"; exit 1; }
          for HOST in "$DOMAIN" "www.$DOMAIN"; do
            [ "$HOST" = "www.$DOMAIN" ] && [ "$DOMAIN" != "$APEX" ] && continue
            NAME=$([ "$HOST" = "$APEX" ] && echo "@" || echo "$HOST")
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"$NAME\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true,\"ttl\":1}" >/dev/null || true
            api -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
              --data "{\"name\":\"$HOST\"}" | node -pe 'const r=JSON.parse(require("fs").readFileSync(0)); (r.success?"attached ":"note ")+JSON.stringify(r.result?.name ?? r.errors)'
          done
          echo "Live at https://$DOMAIN once the certificate is issued (usually a few minutes)."
