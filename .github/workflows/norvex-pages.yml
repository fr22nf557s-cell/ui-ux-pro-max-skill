name: Norvex – deploy site

# Publishes projects/norvex-gaming/ to GitHub Pages on every push that touches it, by
# pushing the assembled site to the gh-pages branch (GitHub publishes that branch as
# https://<owner>.github.io/<repo>/). If the site does not appear after the first run,
# pick it once under repo Settings → Pages → Build and deployment → Source: "Deploy from a
# branch" → gh-pages / (root).
# Custom domain: put the hostname in projects/norvex-gaming/CNAME and point the DNS at
# GitHub Pages (a CNAME record to <owner>.github.io, or the four 185.199.108-111.153 A records).

on:
  push:
    branches:
      - claude/norvex-gaming-ecommerce-5x8luq
      - main
    paths:
      - "projects/norvex-gaming/**"
      - ".github/workflows/norvex-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norvex-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (pages + assets only, no tooling)
        working-directory: projects/norvex-gaming
        run: |
          site="$GITHUB_WORKSPACE/_site"
          mkdir -p "$site/assets/img"
          cp index.html shop.html product.html "$site/"
          cp -r assets/css assets/js "$site/assets/"
          cp assets/img/*.svg "$site/assets/img/"
          cp -r assets/img/products "$site/assets/img/"
          [ -f CNAME ] && cp CNAME "$site/" || true
          echo "site: $(du -sh "$site" | cut -f1), $(find "$site" -type f | wc -l) files"

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual run' }}"
